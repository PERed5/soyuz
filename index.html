<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Союз</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
	<link rel="stylesheet" href="./style.css">
	<link rel="icon" href="./soyuz.png" type="image/png">
</head>
<body id="title" data-aos-easing="ease" data-aos-duration="1000" data-aos-delay="0">
	<div id="stars-container">
		<div class="nebula" style="top: -10%; left: -10%;"></div>
		<div class="nebula nebula-2" style="bottom: -10%; right: -10%;"></div>
		<div class="nebula nebula-3"></div>
	</div>

	<div id="snow"></div>
	<div id="snow2"></div>
	<div id="snow3"></div>

	<div id="preloader" style="display: none;">
		<div class="spinner-border text-primary" role="status">
			<span class="visually-hidden">Загрузка...</span>
		</div>
	</div>

	<div id="content" data-aos="fade-up" class="aos-init aos-animate">
		<h1 class="animate__animated animate__fadeInDown text-center mb-4">СОЮЗ</h1>

		<div class="card server-status-card">
		<div class="card-body">
			<p>Игроки онлайн: <span id="players-current">—</span></p>
			<p>Раунд: <span id="server-round">—</span></p>
			<p>Карта: <span id="server-map">—</span></p>
			<p>Режим: <span id="server-preset">—</span></p>
      		<p>IP: <span id="server-ip">—</span></p>
			<p>Статус раунда: <span id="lobby-status">—</span></p>
      		<p>Статус: <span id="server-status">Загрузка...</span></p>
		</div>
		</div>

		<!-- ============ СОВЕТСКИЙ КРЕДИТ: МАГАЗИН И ТОП (данные с игрового сервера, см. script.js) ============ -->
		<section id="credits-section" class="mb-5" data-aos="fade-up">
			<h2 class="text-center mb-3">Советский кредит</h2>

			<ul class="nav nav-pills credits-tabs justify-content-center mb-4" id="credits-tabs" role="tablist">
				<li class="nav-item" role="presentation">
					<button class="nav-link active" id="credits-shop-tab" data-bs-toggle="pill" data-bs-target="#credits-shop" type="button" role="tab">Магазин</button>
				</li>
				<li class="nav-item" role="presentation">
					<button class="nav-link" id="credits-top-tab" data-bs-toggle="pill" data-bs-target="#credits-top" type="button" role="tab">Топ</button>
				</li>
			</ul>

			<div class="tab-content">
				<div class="tab-pane fade show active" id="credits-shop" role="tabpanel">
					<div class="row g-2 mb-3 credits-filters">
						<div class="col-12 col-md-6">
							<input type="search" id="credits-search" class="form-control" placeholder="Поиск по названию">
						</div>
						<div class="col-12 col-md-6">
							<select id="credits-sort" class="form-select credits-select">
								<option value="price-asc">Цена: по возрастанию</option>
								<option value="price-desc">Цена: по убыванию</option>
								<option value="name">По названию</option>
							</select>
						</div>
					</div>
					<div id="credits-categories" class="credits-categories mb-3"></div>
					<div id="credits-shop-list" class="row g-3"></div>
					<p id="credits-shop-note" class="text-center credits-muted mt-3"></p>
				</div>

				<div class="tab-pane fade" id="credits-top" role="tabpanel">
					<p id="credits-week-note" class="text-center credits-muted mb-4"></p>
					<div class="row g-4" id="credits-top-lists"></div>
				</div>
			</div>
		</section>

		<!-- ============ ВСЕ КАРТОЧКИ ПОДГРУЖАЮТСЯ ИЗ decrees.json ============ -->
		<div class="row g-4" id="decrees-container"></div>

		<footer class="text-center footer text-light small mt-5" style="color: #d1d1d1 !important; opacity: 0.8;"></footer>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
	<script src="./script.js"></script>
</body>
</html>
